version: "3.9"

services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4444:4444"
    volumes:
      # Correct order: host path → container path
      - /var/lib/jenkins/workspace/psm_backend_api/uploads:/app/uploads
    restart: always
    networks:
      - psm_default1

networks:
  psm_default1:
    external: true
